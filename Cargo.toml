[package]
name = "t2048"
version = "1.0.1"
edition = "2024"
# The README claims this too; keeping it here makes cargo fail early and
# clearly instead of letting an old toolchain trip over edition 2024 features.
rust-version = "1.88"
authors = ["microfatrat"]
description = "A 2048 clone for the terminal, built with ratatui"
documentation = "https://docs.rs/t2048"
readme = "README.md"
repository = "https://github.com/microfatrat/t2048"
license = "MIT"
keywords = ["game", "tui", "terminal", "2048", "ratatui"]
categories = ["games", "command-line-utilities"]
# Repo-only files; there is no reason to ship the CI configuration in the crate.
exclude = [".github/"]

[dependencies]
crossterm = "0.29.0"
rand = "0.10.3"
# Only the widgets and backend actually used here; the default feature set also
# pulls in the calendar widget, layout cache, macros and underline support.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }

# `cargo build --release` produces a single small binary.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
